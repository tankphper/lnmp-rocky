user  www www;
worker_processes  auto;

# 强制开启 PCRE2 的 JIT 正则硬件加速引擎（OpenResty 必开）
pcre_jit on;

# log level [debug|info|notice|warn|error|crit]
# 生产环境用 crit，能极大减少 I/O 写入消耗
error_log  logs/error.log  crit;
pid        logs/nginx.pid;
# 提升单个 Worker 进程能打开的最大文件句柄数，高并发地基
worker_rlimit_nofile 51200;

events {
    use epoll;
    # 单个工作进程的最大连接数，总并发 = worker_processes * worker_connections
    worker_connections  51200;
    # 允许 Worker 进程同时接收多个新连接，提升吞吐
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 客户端请求头缓冲区调优
    client_header_buffer_size     32k;
    client_body_buffer_size       32m;
    large_client_header_buffers   4 32k;
    client_max_body_size          32m;
    server_names_hash_bucket_size 512;

    # 开启 Linux 零拷贝（Zero-copy）发送文件，极大减轻 CPU 负担
    sendfile           on;
    # 只有在 sendfile 开启时才生效，减少网络报文碎片，合并发送
    tcp_nopush         on;
    # 禁用 Nagle 算法，让小数据包立刻发送，降低延迟
    tcp_nodelay        on;

    keepalive_timeout  60;

    # FastCGI (PHP-FPM) 优化组
    fastcgi_connect_timeout      300;
    fastcgi_send_timeout         300;
    fastcgi_read_timeout         300;
    fastcgi_buffer_size          256k;
    fastcgi_buffers              4 256k;
    fastcgi_busy_buffers_size    256k;
    # equal or bigger to fastcgi_buffer_size
    fastcgi_temp_file_write_size 256k;
    # use user error page
    fastcgi_intercept_errors     on;

    # Gzip 高级压缩优化
    gzip              on;
    gzip_min_length   1k;
    gzip_buffers      4 16k;
    gzip_http_version 1.1;
    gzip_comp_level   2;
    gzip_types        text/plain text/css application/json application/javascript application/xml text/javascript image/svg+xml;
    gzip_vary         on;
    gzip_proxied      expired no-cache no-store private auth;
    gzip_disable      "MSIE [1-6]\.";

    # share memory 2M, 1M shared memory can save 32,000 32-bit state, 16,000 64-bit state
    # 并发连接数限制（防恶意攻击与爬虫）
    limit_conn_zone $binary_remote_addr zone=connperip:2m;
    limit_conn_zone $server_name zone=connperserver:2m;
    limit_conn_log_level error;
    limit_conn_status 503;

    # limit_rate from http_core_module, most use for download
    # 限速控制：前 100M 全速，之后限制为 1M/s（非常适合下载、视频站点）
    limit_rate_after 100M;
    limit_rate       1M;

    # share memory 2m, 1M shared memory can save 32,000 32-bit state, 16,000 64-bit state
    # 请求频率限制（防暴力流漏洞、CC刷新）
    limit_req_zone $binary_remote_addr zone=reqperip:2m rate=5r/s;
    limit_req_zone $server_name zone=reqperserver:2m rate=10r/s;
    limit_req_log_level error;
    limit_req_status 503; 
     
    # log_formart {name} '{variables}'
    # 访问日志标准定义
    log_format  main  '$remote_addr - $remote_user [$time_local] $request $status $body_bytes_sent $http_referer $http_user_agent $http_x_forwarded_for';

    # 隐藏 Nginx/OpenResty 的具体版本号，防止黑客针对特定版本漏洞发起攻击
    server_tokens off;
    # 全局关闭 access_log 是压榨磁盘 I/O 的终极手段。需要排查时可在具体的 vhost 独立开启
    access_log off;
    
    # push stream memory config
    # 全面激活 Push Stream 模块全局共享内存配置
    #push_stream_shared_memory_size 32M;
    #push_stream_message_template "{\"id\":~id~,\"channel\":\"~channel~\",\"text\":\"~text~\",\"tag\":\"~tag~\",\"time\":\"~time~\"}";    

    include vhost/*.conf;
}
